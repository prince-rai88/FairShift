name: FairShift CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Static Code Analysis (Oxlint)
      run: npm run lint

    - name: Execute Automated Unit Tests (Vitest)
      run: npm test

    - name: Build Production Assets (Vite)
      run: npm run build
